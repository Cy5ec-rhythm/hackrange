<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab: Product Details</title>
  <style>
    body {
      font-family: monospace;
      background: #0f1115;
      color: #d7dbe0;
      display: flex;
      justify-content: center;
      padding-top: 60px;
    }
    .card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      padding: 32px;
      width: 480px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; color: #ffb454; }
    p.sub { color: #7d8590; font-size: 13px; margin-bottom: 20px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      background: #0f1115;
      border: 1px solid #2a2f3a;
      color: #d7dbe0;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      background: #ffb454;
      color: #0f1115;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #2a2f3a;
    }
    th { color: #7d8590; font-weight: normal; width: 30%; }
    .error {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      background: #3b1212;
      border: 1px solid #6b1f1f;
      color: #ff7b72;
      word-break: break-word;
    }
    .empty { color: #7d8590; font-size: 13px; }
    .hint { color: #7d8590; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Product Details</h1>
    <p class="sub">Look up a product by ID</p>
    <form method="GET">
      <input type="text" name="id" placeholder="e.g. 1" value="{{ product_id }}" autocomplete="off">
      <button type="submit">View</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% elif result %}
      <table>
        <tr><th>ID</th><td>{{ result[0] }}</td></tr>
        <tr><th>Name</th><td>{{ result[1] }}</td></tr>
        <tr><th>Price</th><td>{{ result[2] }}</td></tr>
      </table>
    {% elif product_id %}
      <p class="empty">No product found with that ID.</p>
    {% endif %}

    <p class="hint">Try product IDs: 1, 2, 3</p>
  </div>
</body>
</html>
